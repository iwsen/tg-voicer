# ==============================================================================
# TG-VOICER Configuration
# Автоматическая расшифровка голосовых сообщений и кружочков через Telegram Premium
# ==============================================================================

[telegram]
# Получите api_id и api_hash на сайте https://my.telegram.org (пункт 'API development tools')
api_id = 12345678
api_hash = "0123456789abcdef0123456789abcdef"

# Имя сессии (файл сохраняется в папке data/session_name.session)
session_name = "tg_voicer"

# Расшифровывать голосовые сообщения (.ogg / .opus)
transcribe_voice = true

# Расшифровывать видеосообщения (круглые видеосообщения / кружочки)
transcribe_video_notes = true

# Расшифровывать собственные отправленные голосовые (true - да, false - только входящие)
transcribe_outgoing = false


[filters]
# 1. ТИПЫ ЧАТОВ, КОТОРЫЕ НУЖНО ИГНОРИРОВАТЬ.
# Допустимые значения в списке:
#   "channels"    - каналы (broadcast channels)
#   "groups"      - обычные группы и супергруппы
#   "private"     - личные сообщения (директ 1-на-1)
#   "bots"        - диалоги с ботами
# Пример: ignore_types = ["channels", "bots"]
ignore_types = []

# 2. КОНКРЕТНЫЕ ЧАТЫ, ГРУППЫ ИЛИ КАНАЛЫ ДЛЯ ИГНОРИРОВАНИЯ.
# Можно указывать:
#   - ID чата (число, например -1001234567890 или 12345678)
#   - Username (например "@annoying_channel" или "work_group")
#   - Название или часть названия (например "Рабочий флуд", "Новости")
# Пример:
# ignored_chats = [
#     "@news_feed",
#     -100192837465,
#     "Мемы и флуд"
# ]
ignored_chats = []

# 3. КОНКРЕТНЫЕ ПОЛЬЗОВАТЕЛИ (ЛЮДИ), ЧЬИ ГОЛОСОВЫЕ НУЖНО ИГНОРИРОВАТЬ.
# Можно указывать:
#   - ID пользователя (число, например 123456789)
#   - Username (например "@spammer_bot" или "john_doe")
#   - Имя / фамилию (например "Иван Иванов")
# Пример:
# ignored_users = [
#     "@annoying_colleague",
#     987654321,
#     "Спамер"
# ]
ignored_users = []

# 4. БЕЛЫЙ СПИСОК ЧАТОВ (Опционально).
# Если этот список НЕ пустой, скрипт будет расшифровывать голосовые ТОЛЬКО в этих чатах!
allowed_chats = []

# 5. БЕЛЫЙ СПИСОК ПОЛЬЗОВАТЕЛЕЙ (Опционально).
# Если этот список НЕ пустой, скрипт будет расшифровывать голосовые ТОЛЬКО от этих людей!
allowed_users = []

# Фильтрация по длительности в секундах (0 = без ограничений)
min_duration_seconds = 0
max_duration_seconds = 0


[realtime]
# Отслеживать новые сообщения в реальном времени и сразу нажимать кнопку
enabled = true

# Ожидать завершения расшифровки, если Telegram вернул статус "в обработке" (pending)
wait_for_completion = true

# Таймаут ожидания распознавания одного сообщения (в секундах)
timeout_seconds = 30


[backfill]
# Обрабатывать старые (архивные) голосовые сообщения, пока нет новых
enabled = true

# Пауза между запросами расшифровки старых сообщений (в секундах).
# ВАЖНО: Telegram лимитирует частые запросы (FloodWait). Рекомендуется 1.5 - 3.0 сек.
delay_seconds = 2.0

# Максимальное количество сообщений для сканирования на один чат (0 = без лимита, до самого первого сообщения)
max_messages_per_chat = 0

# Максимальное количество чатов для сканирования (0 = все доступные)
max_chats = 0

# Размер пачки сообщений при чтении истории
batch_size = 100


[storage]
# Путь к SQLite базе данных для хранения статуса и истории расшифровок
db_path = "data/voicer.db"


[logging]
# Уровень логирования: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"

# Сохранять лог в файл
log_to_file = true
log_file_path = "data/voicer.log"
